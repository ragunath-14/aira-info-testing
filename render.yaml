# =============================================================================
# AIRAOS Infra Console — Render Blueprint Deployment
# =============================================================================

services:
  # ------------------------------------------------------------------ API Service
  - type: web
    name: airaos-infra-api
    env: node
    plan: free
    region: singapore
    buildCommand: npm install && npm run build:packages && npm run build -w @airaos/api
    startCommand: npm run migrate -w @airaos/api && npm run start -w @airaos/api
    envVars:
      # NODE_ENV stays "test" (not "production") for this Phase 1 test
      # deployment: loadConfig() hard-refuses to boot with
      # LOCAL_AUTH_ENABLED=true when NODE_ENV=production unless a real
      # AIRAOS SSO provider (AIRAOS_AUTH_URL/CLIENT_ID) is also configured.
      # Switch to NODE_ENV=production + real SSO vars before any
      # company-domain/production phase.
      - key: NODE_ENV
        value: test
      - key: APP_ENV
        value: production
      - key: API_PORT
        value: 10000
      - key: API_HOST
        value: 0.0.0.0
      - key: LOCAL_AUTH_ENABLED
        value: "true"
      # Overrides the seed script's weak default (airaos-dev-password) for
      # the auto-created local operator. Set both in the Render dashboard.
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      # Points at the airaos-console-db instance you already created and
      # migrated by hand — not managed by this blueprint (see note below),
      # so it's a plain dashboard secret rather than fromDatabase. Paste the
      # Internal Database URL from that Postgres's Connections tab.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      # Secrets are entered directly in the Render dashboard, never committed here.
      - key: ENCRYPTION_KEY
        sync: false
      - key: AUDIT_LOG_SECRET
        sync: false
      - key: SESSION_SECRET
        sync: false
      # Render's Blueprint fromService only exposes connectionString/host/
      # hostport/port for a sibling service — not its public HTTPS URL — so
      # this has to be filled in by hand once airaos-infra-web has a real
      # onrender.com address. Set to that exact URL, e.g.
      # https://airaos-infra-web-xxxx.onrender.com (no trailing slash).
      - key: CORS_ORIGINS
        sync: false

  # ------------------------------------------------------------------ Web Service
  - type: web
    name: airaos-infra-web
    env: node
    plan: free
    region: singapore
    buildCommand: npm install && npm run build:packages && npm run build -w @airaos/web && cp -r apps/web/.next/static apps/web/.next/standalone/apps/web/.next/static && cp -r apps/web/public apps/web/.next/standalone/apps/web/public
    startCommand: node apps/web/.next/standalone/apps/web/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: HOSTNAME
        value: 0.0.0.0
      # Render's free-tier web service Connect tab doesn't expose a private-
      # network address to confirm the internal hostname format, and a
      # guessed http://<service-name>:<port> value failed to connect (503
      # PROVIDER_UNAVAILABLE from the proxy). Use the API's public HTTPS URL
      # instead — confirmed reachable — e.g. https://airaos-infra-api.onrender.com.
      # Still server-to-server only; the browser never calls this directly.
      - key: API_INTERNAL_URL
        sync: false
      - key: NEXT_PUBLIC_API_BASE_URL
        value: /api/proxy

# airaos-console-db (Render free Postgres) was created and migrated by hand
# before this blueprint existed, so it's intentionally NOT declared under a
# `databases:` block here — doing so would make Render's Blueprint sync try
# to provision a second, empty Postgres with a colliding name instead of
# reusing the one already migrated. Wire DATABASE_URL to it manually in the
# dashboard instead (see the API service's env vars above).
#
# Render free Postgres note: not deleted on a schedule, but Render suspends
# (not deletes) a free instance after 90 days of inactivity — resume it from
# the dashboard if that happens. Still $0.
